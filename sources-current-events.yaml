# current-events プロファイルのソース（SPEC.md §5「current-events のソース」、specs/016）
# URL は 2026-11-09 に実際に取得して確認したもの。
# AI の専門・AI の分類のフィード以外は、require_keywords で AI の記事だけに絞る。
# 照合は部分一致なので、英語のソースを require_keywords で絞らない（SPEC.md §5）。

ai_keywords: &ai_keywords
  - AI
  - 人工知能
  - ChatGPT
  - Gemini
  - Claude
  - Copilot
  - OpenAI
  - Anthropic
  - LLM
  - チャットボット

# 全ソース共通の除外（製品のセールなど）。「セール」だけだと「セールス」にも一致するため「セール中」
exclude_keywords:
  - お買い得
  - セール中
  - 【PR】
  - 値引き
  - "% OFF"
  - ％オフ

