[project]
name = "aidigest"
version = "0.1.0"
description = "Claude Code と LLM の情報を収集し、日本語で要約して毎朝メール配信する"
authors = [{ name = "dreammind" }]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]
