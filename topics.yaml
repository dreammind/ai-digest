# テーマ別の重みとキーワード、採点のパラメータ（SPEC.md §3・§4、specs/006-local-score.md）
# 照合は全角・半角と大文字・小文字を同一視した部分一致。

scoring:
  priority_bonus: {1: 2.0, 2: 1.0, 3: 0.0}
  high_points: 2.0
  medium_points: 1.0
  negative_points: 3.0
  highlight_points: 1.0
  content_factor: 0.25
  max_hits: 3
  min_score: 1.0
  similarity_threshold: 0.45
  ngram: 2

topics:
  # 優先度「高」: Claude Code の新機能・活用手法・運用ノウハウ
  - id: claude_code
    weight: 3.0
    high:
      - Claude Code
      - ClaudeCode
      - claude-code
      - CLAUDE.md
      - サブエージェント
      - subagent
      - hooks
      - フック
      - スラッシュコマンド
      - slash command
      - Agent SDK
      - Skill
      - スキル
      - Mods
    medium:
      - MCP
      - AGENTS.md
      - worktree
      - headless
      - claude -p
      - 権限
      - permission
      - サンドボックス
      - sandbox
      - auto mode
      - コンテキスト
      - context
      - ハーネス
      - harness
      - コードレビュー
      - code review

  # 優先度「中」: LLM 全般（新モデル、API、エージェント設計、評価、プロンプト技法）
  - id: llm
    weight: 2.0
    high:
      - LLM
      - 大規模言語モデル
      - Claude
      - Anthropic
      - Opus
      - Sonnet
      - Haiku
      - OpenAI
      - GPT
      - Gemini
      - オープンウェイト
      - open-weight
      - プロンプト
      - prompt
      - RAG
      - eval
      - 評価
      - ベンチマーク
      - benchmark
    medium:
      - AI
      - AI駆動
      - エージェント
      - agent
      - 生成AI
      - Codex
      - Cursor
      - Copilot
      - DeepSeek
      - Qwen
      - Llama
      - Mistral
      - 推論
      - reasoning
      - fine-tun
      - ファインチューニング
      - トークン
      - token

# 全テーマ共通の減点（企業のゴシップ、求人、イベント告知など）
negative:
  - 逮捕
  - arrested
  - 売上
  - revenue
  - IPO
  - 株価
  - 訴訟
  - lawsuit
  - 解雇
  - 求人
  - hiring
  - ハッカソン
  - hackathon

# 配信する件数とグループごとの上限（SPEC.md §8、specs/009-slot-allocation.md）
digest:
  size: 8
  limits:
    claude_code: 4  # 手法と更新情報の合計
    llm: 3
    other: 2
  # Claude Code の記事のうち、タイトルにこれらを含むものは「Claude Code 更新情報」に入れる
  update_keywords: [リリース, 新機能, アップデート, release, changelog]
