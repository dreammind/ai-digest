# ツールのバージョンは uv.lock と揃えるため、すべて uv 経由のローカルフックで実行する
repos:
  - repo: local
    hooks:
      - id: no-api-keys
        name: API キーらしい文字列が無いか
        # Anthropic（sk-ant-...）と一般的な sk-... の長いキー。テスト用の短い偽のキーは対象外。
        # 一致した行は表示せず（キーをログに出さないため）、ファイル名だけを出す。
        entry: >-
          bash -c 'if grep -IlE "sk-(ant-)?[A-Za-z0-9_-]{40,}" "$@"; then
          echo "↑ API キーらしい文字列を含むため、コミットを止めました"; exit 1; fi' --
        language: system
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        always_run: true
